name: Release

# Релиз собирается сам, когда в main приходит новая версия в module.json.
# Foundry берёт манифест из последнего релиза, поэтому после релиза у всех
# появляется кнопка обновления модуля.

on:
  push:
    branches: [main]
    paths: [module.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версия
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./module.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '^artarius.zip$'; then
            echo "Релиз v$VERSION уже есть"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.v.outputs.skip != 'true'
        run: npm ci
      - if: steps.v.outputs.skip != 'true'
        run: npm run lint
      - if: steps.v.outputs.skip != 'true'
        run: npm test
      - if: steps.v.outputs.skip != 'true'
        run: npm run dist
      - name: Релиз
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          sh tools/release-notes.sh "$VERSION" > notes.md
          FILES="dist/artarius.zip dist/module.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
